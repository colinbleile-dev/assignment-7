<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Team Task Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary" id="main-nav">
        <div class="container-fluid">
            <span class="navbar-brand">TaskFlow</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-md-10 col-lg-8 mx-auto" id="main-content">
                <h4 id="page-title">Team Tasks</h4>
                
                <!-- TODO -->
                <div class="card" id="create-task-card">
                    <div class="card-header">
                        <h6>Create New Task</h6>
                    </div>
                    <div class="card-body">
<form id="create-task-form" class="mb-3">
  <div class="mb-2">
    <label class="form-label">Task Title</label>
    <input type="text" id="task-title" class="form-control" required>
  </div>
  <div class="mb-2">
    <label class="form-label">Description</label>
    <input type="text" id="task-desc" class="form-control">
  </div>
  <div class="mb-2">
    <label class="form-label">Due Date</label>
    <input type="date" id="task-due-date" class="form-control" required>
  </div>
  <div class="mb-2">
    <label class="form-label">Assign To</label>
    <select id="task-assignee" class="form-select">
      <option value="Person 1">Person 1</option>
      <option value="Person 2">Person 2</option>
      <option value="Person 3">Person 3</option>
      <option value="Person 4">Person 4</option>
      <option value="Person 5">Person 5</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary btn-sm">Add Task</button>
</form>                    </div>
                </div>

                <!-- Task List -->
                <h6 id="task-list-title">Current Tasks</h6>
                <div id="taskList">
                    <!-- Sample task -->
                    <div class="card task-item">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="task-content">
                                    <div class="task-title">Sample Task</div>
                                    <div class="task-description">This is what a task looks like</div>
                                    <div class="task-date">Due: 2025-10-15</div>
                                    <!-- TODO -->
                                </div>
                                <div class="task-actions">
                                    <!-- TODO -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
